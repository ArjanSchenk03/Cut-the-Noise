# Netlify-config voor de CTN-CRM.
# Staat bewust in crm/app (niet in de repo-root), zodat de Cut-the-Noise
# marketingsite in de root hier geen last van heeft.
#
# Koppel je dit later aan GitHub? Zet in de Netlify-UI:
#   Base directory: crm/app
# en de env-vars VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-fallback: onbekende paden naar index.html zodat React Router werkt
# (bijv. /dashboard verversen). Bestaande bestanden zoals /offerte.html
# worden door Netlify altijd éérst geserveerd, dus die blijven werken.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
